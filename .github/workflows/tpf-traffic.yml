name: Collect TPF traffic (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpf-traffic.yml'
      - 'scripts/collect-tpf.py'
      - 'scripts/collect-tpf.mjs'
      - 'scripts/tpf-parse.mjs'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: tpf-traffic-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test matching and parser
        run: node alerts.test.mjs
      - name: Collect public current-traffic section
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-tpf.py | node scripts/collect-tpf.mjs "$RUNNER_TEMP/alerts.json"
      - name: Publish isolated traffic data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin traffic-data >/dev/null; then
            git fetch origin traffic-data
            git switch -C traffic-data FETCH_HEAD
          else
            git switch --orphan traffic-data
          fi
          cp "$RUNNER_TEMP/alerts.json" alerts.json
          git add alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TPF traffic snapshot"
            git push origin HEAD:traffic-data
          fi
