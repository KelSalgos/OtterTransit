name: Collect TPF traffic (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpf-traffic.yml'
      - 'scripts/collect-tpf.py'
      - 'scripts/collect-tpf.mjs'
      - 'scripts/collect-tpf-browser.py'
      - 'scripts/tpf-parse.mjs'
  schedule:
    # Avoid the usual quarter-hour schedule peaks; execution remains best-effort.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: tpf-traffic-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test matching and parser
        run: node alerts.test.mjs
      - name: Collect public current-traffic section
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-tpf.py | node scripts/collect-tpf.mjs "$RUNNER_TEMP/alerts.json"
      - name: Render planned notices if HTML lacks detail
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'const d=require(process.argv[1]);process.exit(d.plannedStatus==="unknown"?0:1)' "$RUNNER_TEMP/alerts.json"; then
            if python3 -m pip install --quiet playwright==1.51.0 && python3 -m playwright install --with-deps chromium && python3 scripts/collect-tpf-browser.py > "$RUNNER_TEMP/tpf-rendered.txt" && node scripts/collect-tpf.mjs "$RUNNER_TEMP/rendered-alerts.json" < "$RUNNER_TEMP/tpf-rendered.txt"; then
              node -e 'const fs=require("fs"),a=JSON.parse(fs.readFileSync(process.argv[1])),b=JSON.parse(fs.readFileSync(process.argv[2]));if(b.plannedStatus!=="unknown"){a.plannedStatus=b.plannedStatus;a.planned=b.planned;fs.writeFileSync(process.argv[1],JSON.stringify(a,null,2)+"\n")}' "$RUNNER_TEMP/alerts.json" "$RUNNER_TEMP/rendered-alerts.json"
            else
              echo "::warning::Planned notices could not be rendered; publishing current data with unknown planned coverage."
            fi
          fi
      - name: Publish isolated traffic data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin traffic-data >/dev/null; then
            git fetch origin traffic-data
            git switch -C traffic-data FETCH_HEAD
          else
            git switch --orphan traffic-data
          fi
          cp "$RUNNER_TEMP/alerts.json" alerts.json
          git add alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TPF traffic snapshot"
            git push origin HEAD:traffic-data
          fi
